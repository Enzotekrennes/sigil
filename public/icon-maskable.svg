<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Sigil maskable app icon: same drawing as icon.svg scaled to 76 % so it stays inside the 80 % safe zone that launchers may crop to. Source of pwa-maskable-512x512.png. -->
  <rect width="512" height="512" fill="#f3eee3"/>
  <g transform="translate(256 256) scale(0.76) translate(-256 -256)" fill="none" stroke="#1c1914" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="256" cy="256" r="200"/>
    <polyline points="256,356 156,156 356,256 356,156 156,356"/>
    <circle cx="256" cy="356" r="18" fill="#f3eee3"/>
    <line x1="133" y1="333" x2="179" y2="379"/>
  </g>
</svg>
